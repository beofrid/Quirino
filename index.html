<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sistema Quirino</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
        <link rel="stylesheet" href="style.css">
    
    </head>
    <body class="bg-light montserrat">

        <header>
            <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
                <div class="container">
                    <a class="navbar-brand" href="index.html"><span class="fw-light"> Sistema</span> <span class="mystery-quest fw-bold">Quirino</span></a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav me-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="index.html">Escola</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="pages/pedagogico.html">Setor Pedagógico</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="pages/rh.html">Setor RH</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="pages/sobre.html">Sobre</a>
                            </li>
                        </ul>
                        <span class="navbar-text">
                            Escola Castelo | <a href="#" class="text-danger text-decoration-none">Sair</a>
                        </span>
                    </div>
                </div>
            </nav>

        </header>
        <main>
            <div class="container">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Painel da Escola: Solicitações</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalSolicitacao">Nova Solicitação +</button>
                </div>

                <div class="card shadow-sm p-4 bg-white">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cargo</th>
                                <th>Data</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="lista-solicitacoes"></tbody>
                    </table>
                </div>
            </div>

            <div class="modal fade" id="modalSolicitacao" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Nova Solicitação</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <form>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Cargo Desejado</label>
                                    <select class="form-select" id="cargoSelect" required>
                                        <option value="" selected disabled>Selecione o cargo</option>
                                    </select>
                                    
                                    <label class="form-label fw-bold pt-3">Horário de atuação</label>
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <input type="text" id="entrada1" class="form-control time-picker" placeholder="Entrada 1 (ex: 08:00)">
                                        </div>
                                        <div class="col-6">
                                            <input type="text" id="saida1" class="form-control time-picker" placeholder="Saída 1 (ex: 12:00)">
                                        </div>
                                        <div class="col-6">
                                            <input type="text" id="entrada2" class="form-control time-picker" placeholder="Entrada 2 (ex: 13:30)">
                                        </div>
                                        <div class="col-6">
                                            <input type="text" id="saida2" class="form-control time-picker" placeholder="Saída 2 (ex: 17:30)">
                                        </div>
                                    </div>

                                    <label class="form-label fw-bold pt-3">Tipo de Contratação</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="tipoContratacao" id="tipoSubstituicao" value="substituicao" checked>
                                            <label class="form-check-label" for="tipoSubstituicao">Substituição</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="tipoContratacao" id="tipoNovo" value="aumento">
                                            <label class="form-check-label" for="tiponovo">Nova contratação</label>
                                        </div>
                                    </div>
                                    
                                    <div id="substituicao">
                                        <label class="form-label fw-bold pt-3">Servidor substituido</label>
                                        <input id="sName" type="text" class="form-control" placeholder="Nome completo" required>
                                        <label class="form-label fw-bold pt-3">Matrícula</label>
                                        <input id="sId" type="number" class="form-control" placeholder="Ex.: 7890 " required>
                                    </div>
                                    
                                    <div id="contratacao">
                                        <label class="form-label fw-bold pt-3">Justificativa</label>
                                        <textarea id="textArea" class="form-control" id="observacaoTextarea" rows="3" placeholder="Descreva resumidamente (não identificar aluno)" required></textarea>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Salvar Solicitação</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="/scripts/modal.js"></script>
        <script src="/scripts/requestCard.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <script>
            flatpickr(".time-picker", {
                enableTime: true,
                noCalendar: true,
                dateFormat: "H:i", 
                time_24hr: true,   
                minuteIncrement: 15 
            });
        </script>
    </body>
</html>
