<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sistema Quirino</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
        <link rel="stylesheet" href="../style.css">
        <link rel="shortcut icon" href="../src/icon.ico" type="image/x-icon">
        <script type="module" src="../scripts/components/PublicNavbar.js"></script>
        <script type="module" src="../scripts/components/Footer.js"></script>
    
    </head>
    <body class="bg-light d-flex flex-column min-vh-100 montserrat">

        <header>
            <public-navbar></public-navbar>
        </header>

        <main class="flex-grow-1 py-4">
            <div class="container">
                <section class="card border-0 shadow-sm overflow-hidden" aria-labelledby="titulo-ajuda">
                    <div class="card-body p-4 p-md-5">
                        <div class="row align-items-center g-4">
                            <div class="col-lg-4 text-center">
                                <img
                                    src="../src/icon.png"
                                    class="img-fluid"
                                    style="max-width: 180px;"
                                    alt="Logotipo do Sistema Quirino"
                                >
                            </div>

                            <div class="col-lg-8">
                                <span class="badge text-bg-primary mb-2">Central de ajuda</span>
                                <h1 id="titulo-ajuda" class="h2 mb-3">
                                    Como podemos ajudar?
                                </h1>
                                <p class="text-secondary mb-4">
                                    Entre em contato com a equipe do
                                    <span class="mystery-quest fw-bold text-dark">Quirino</span>
                                    por um dos canais abaixo.
                                </p>

                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <article class="card h-100 border-primary-subtle">
                                            <div class="card-body">
                                                <h2 class="h5 card-title">E-mail</h2>
                                                <p id="endereco-email" class="card-text text-break mb-3">email@email.com</p>
                                                <button
                                                    id="botao-copiar-email"
                                                    class="btn btn-outline-primary w-100"
                                                    type="button"
                                                    onclick="copiarEmail()"
                                                >
                                                    Copiar e-mail
                                                </button>
                                                <p id="status-copia" class="small mt-2 mb-0" aria-live="polite"></p>
                                            </div>
                                        </article>
                                    </div>

                                    <div class="col-md-6">
                                        <article class="card h-100 border-success-subtle">
                                            <div class="card-body d-flex flex-column">
                                                <h2 class="h5 card-title">WhatsApp</h2>
                                                <p class="card-text">123456789</p>
                                                <a
                                                    class="btn btn-outline-success w-100 mt-auto"
                                                    href="https://wa.me/123456789"
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    aria-label="Conversar com o suporte pelo WhatsApp em uma nova aba"
                                                >
                                                    Conversar no WhatsApp
                                                </a>
                                            </div>
                                        </article>
                                    </div>

                                    <div class="col-12">
                                        <article class="card border-secondary-subtle">
                                            <div class="card-body d-md-flex align-items-center justify-content-between gap-3">
                                                <div>
                                                    <h2 class="h5 card-title">Telefone</h2>
                                                    <p class="card-text mb-md-0">0800 — ramal 100</p>
                                                </div>
                                   
                                            </div>
                                        </article>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
            <p class="badge text-bg-warning">Esta página foi criada utilizando Inteligência Artificial</p>

        </main>
        <footer class="bg-white border-top py-3 mt-auto">
           <page-footer></page-footer>
        </footer>
    
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script>
            async function copiarEmail() {
                const enderecoEmail = document.getElementById('endereco-email').textContent.trim();
                const statusCopia = document.getElementById('status-copia');
                const botaoCopiar = document.getElementById('botao-copiar-email');

                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(enderecoEmail);
                    } else {
                        const campoTemporario = document.createElement('textarea');
                        campoTemporario.value = enderecoEmail;
                        campoTemporario.setAttribute('readonly', '');
                        campoTemporario.style.position = 'fixed';
                        campoTemporario.style.opacity = '0';
                        document.body.appendChild(campoTemporario);
                        campoTemporario.select();

                        const copiado = document.execCommand('copy');
                        campoTemporario.remove();

                        if (!copiado) {
                            throw new Error('Não foi possível copiar o endereço.');
                        }
                    }

                    statusCopia.className = 'small mt-2 mb-0 text-success';
                    statusCopia.textContent = 'E-mail copiado com sucesso!';
                    botaoCopiar.textContent = 'E-mail copiado';

                    setTimeout(() => {
                        botaoCopiar.textContent = 'Copiar e-mail';
                        statusCopia.textContent = '';
                    }, 3000);
                } catch (erro) {
                    statusCopia.className = 'small mt-2 mb-0 text-danger';
                    statusCopia.textContent = 'Não foi possível copiar. Selecione o endereço manualmente.';
                }
            }
        </script>

    </body>
</html>
