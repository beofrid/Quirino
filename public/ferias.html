<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Solicitação de Férias | Sistema Quirino</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="/style.css">
        <link rel="shortcut icon" href="/src/icon.ico" type="image/x-icon">

        <script type="module" src="/scripts/components/PublicNavbar.js"></script>
        <script type="module" src="/scripts/components/Footer.js"></script>
    </head>

    <body class="bg-light d-flex flex-column min-vh-100 montserrat">
        <header>
            <public-navbar></public-navbar>
        </header>

        <main class="flex-grow-1">
            <div class="container pb-4">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-9 col-lg-7">
                        <div class="card border-0 shadow-sm bg-white">
                            <div class="card-body p-4 p-md-5">
                                <h2 class="h mb-2 d-flex align-items-center gap-2">
                                    Férias
                                    <i data-lucide="construction" class="text-warning rounded bg-dark text-start mx-2" width="28" height="28" aria-hidden="true"></i>
                                </h2>
                                <h5 class="h5 mb-4">Nova Solicitação</h5>

                                <form id="formSolicitacaoFerias">
                                    <div class="mb-3">
                                        <label for="nomeServidor" class="form-label">Nome do servidor</label>
                                        <input
                                            type="text"
                                            class="form-control"
                                            id="nomeServidor"
                                            name="nomeServidor"
                                            placeholder="Nome completo"
                                            autocomplete="name"
                                            required
                                            aria-required="true">
                                    </div>

                                    <div class="mb-3">
                                        <label for="matricula" class="form-label">Matrícula</label>
                                        <input
                                            type="text"
                                            class="form-control"
                                            id="matricula"
                                            name="matricula"
                                            placeholder="Ex.: 7890"
                                            inputmode="numeric"
                                            required
                                            aria-required="true">
                                    </div>

                                    <div class="mb-3">
                                        <label for="dataInicio" class="form-label">Data de início</label>
                                        <input
                                            type="date"
                                            class="form-control"
                                            id="dataInicio"
                                            name="dataInicio"
                                            required
                                            aria-required="true">
                                    </div>

                                    <div class="mb-4">
                                        <label for="duracao" class="form-label">Duração</label>
                                        <div class="input-group">
                                            <input
                                                type="number"
                                                class="form-control"
                                                id="duracao"
                                                name="duracao"
                                                value="30"
                                                min="1"
                                                step="1"
                                                required
                                                aria-required="true"
                                                aria-describedby="duracaoUnidade">
                                            <span class="input-group-text" id="duracaoUnidade">dias</span>
                                        </div>
                                    </div>

                                    <button type="submit" class="btn btn-primary w-100">
                                        Enviar Solicitação
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="bg-white border-top py-3 mt-auto">
            <page-footer></page-footer>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script>lucide.createIcons();</script>
    </body>
</html>
