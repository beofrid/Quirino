<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sistema Quirino</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
        <link rel="stylesheet" href="../style.css">
        <link rel="shortcut icon" href="../src/icon.ico" type="image/x-icon">
        <script type="module" src="../scripts/components/EscolaNavbar.js"></script>
    </head>
    <body class="bg-light d-flex flex-column min-vh-100 montserrat">

        <header>
        <escola-navbar></escola-navbar>
        </header>
        <main>
            <div class="container">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Painel da Escola: Solicitações</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalSolicitacao">Nova Solicitação +</button>
                </div>

                <div class="card shadow-sm p-4 bg-white">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cargo</th>
                                <th>Data</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="lista-solicitacoes"></tbody>
                    </table>
                </div>
            </div>

            <div class="modal fade" id="modalSolicitacao" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Nova Solicitação</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <form>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Cargo Desejado</label>
                                    <select class="form-select" id="cargoSelect" required>
                                        <option value="" selected disabled>Selecione o cargo</option>
                                    </select>
                                    
                                    <label class="form-label fw-bold pt-3">Horário de atuação</label>
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <input type="text" id="entrada1" class="form-control time-picker" placeholder="Entrada 1 (ex: 08:00)">
                                        </div>
                                        <div class="col-6">
                                            <input type="text" id="saida1" class="form-control time-picker" placeholder="Saída 1 (ex: 12:00)">
                                        </div>
                                        <div class="col-6">
                                            <input type="text" id="entrada2" class="form-control time-picker" placeholder="Entrada 2 (ex: 13:30)">
                                        </div>
                                        <div class="col-6">
                                            <input type="text" id="saida2" class="form-control time-picker" placeholder="Saída 2 (ex: 17:30)">
                                        </div>
                                    </div>

                                    <label class="form-label fw-bold pt-3">Tipo de Contratação</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="tipoContratacao" id="tipoSubstituicao" value="substituicao" checked>
                                            <label class="form-check-label" for="tipoSubstituicao">Substituição</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="tipoContratacao" id="tipoNovo" value="aumento">
                                            <label class="form-check-label" for="tiponovo">Nova contratação</label>
                                        </div>
                                    </div>
                                    
                                    <div id="substituicao">
                                        <label class="form-label fw-bold pt-3">Servidor substituido</label>
                                        <input id="sName" type="text" class="form-control" placeholder="Nome completo" >
                                        <label class="form-label fw-bold pt-3">Matrícula</label>
                                        <input id="sId" type="number" class="form-control" placeholder="Ex.: 7890 " >
                                    </div>
                                    
                                    <div id="contratacao">
                                        <label class="form-label fw-bold pt-3">Justificativa</label>
                                        <textarea id="textArea" class="form-control" id="observacaoTextarea" rows="3" placeholder="Descreva resumidamente (não identificar aluno)" ></textarea>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Salvar Solicitação</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            
        </main>

        <footer class="bg-white border-top py-3 mt-auto">
            <div class="container text-center text-muted">
                <p class="mb-1">© 2026 Sistema Quirino - Gestão de Contratações. Todos os direitos reservados.</p>
                <p class="mb-0">Desenvolvido por <strong>Bruno Medeiros Dias</strong></p>
                <p> Link do repositório <a class="text-muted fw-bold text-decoration-none" target="_blank" href="https://github.com/beofrid/Quirino">Github</a></p>
                <a href="https://www.flaticon.com/free-icons/casino-chips" style="font-size: 0.6rem;" class="text-muted text-decoration-none" title="casino chips icons">Casino chips icons created by Anggara - Flaticon</a>
            </div>
        </footer>

    </body>
</html>
