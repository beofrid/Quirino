<!doctype html>
<html lang="pt-br">

        <!-- bootstrap -->

        <!-- Utilitário para hora -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        
        <!-- CSS global -->
        <link rel="stylesheet" href="../../style.css">
        
        <!-- Favicon -->
        <link rel="shortcut icon" href="../../src/icon.ico" type="image/x-icon">

        <!-- Importa componentes reutilizáveis -->
        <script type="module" src="../../scripts/components/EscolaNavbar.js"></script>
        <script type="module" src="../../scripts/components/ContrataModal.js"></script>
        <script type="module" src="../../scripts/components/Footer.js"></script>
        <script type="module" src="../../scripts/controllers/HiringRequestController.js"></script>
        
        <!-- Importa lógica -->
        <script type="module" src="../../scripts/controllers/NavbarController.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <body class="bg-light d-flex flex-column min-vh-100 montserrat">

        <header>
        <escola-navbar></escola-navbar>
        </header>
        <main>
            <div class="container">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Painel da Escola: Contratações</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalSolicitacao">Nova Solicitação +</button>
                </div>

                <div class="card shadow-sm p-4 bg-white">
                    <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cargo</th>
                                <th>Data</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="lista-solicitacoes">
                            <tr>
                                <td colspan="5" class="text-center text-secondary py-4">Carregando solicitações...</td>
                            </tr>
                        </tbody>
                    </table>
                    </div>
                </div>
            </div>

            <contrata-modal></contrata-modal>

            
        </main>

        <footer class="bg-white border-top py-3 mt-auto">
            <page-footer></page-footer>

        </footer>
