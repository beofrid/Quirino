<!doctype html>
<html lang="pt-br">
        <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sistema Quirino</title>
        <!-- bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        
        <!-- Utilitário para hora -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        
        <!-- CSS global -->
        <link rel="stylesheet" href="../../style.css">
        
        <!-- Favicon -->
        <link rel="shortcut icon" href="../../src/icon.ico" type="image/x-icon">

        <!-- Importa componentes reutilizáveis -->
        <script type="module" src="../../scripts/components/EscolaNavbar.js"></script>
        <script type="module" src="../../scripts/components/RegimeSuplementarModal.js"></script>
        <script type="module" src="../../scripts/components/Footer.js"></script>
        
        <!-- Importa lógica -->
        <script type="module" src="../../scripts/controllers/NavbarController.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
  
    </head>
    <body class="bg-light d-flex flex-column min-vh-100 montserrat">

        <header>
        <escola-navbar></escola-navbar>
        </header>
        <main>
            <div class="container">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="d-flex align-items-center gap-2">
                        Painel da Escola: Desdobramento
                        <i
                            data-lucide="construction"
                            class="text-warning rounded bg-dark text-start mx-2"
                            width="28"
                            height="28"
                            aria-hidden="true">
                        </i>
                    </h2>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalRegimeSuplementar">Nova Solicitação +</button>
                </div>

                <div class="card shadow-sm p-4 bg-white">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Início</th>
                                <th>Tipo</th>
                                <th>Quantidade</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                            <tr>
                                <td>15</td>
                                <td>Adão Branco Costa</td>
                                <td>02/09/2026</td>
                                <td>Aumentar</td>
                                <td>5 horas</td>
                                <td><span class="badge bg-success text-light">Concluído</span></td>
                                <td>
                                    <button class="btn btn-sm btn-outline-info">Ver</button>
                                </td>
                            </tr>
                            <tr>
                                <td>22</td>
                                <td>Denise Eduarda Figueira</td>
                                <td>22/09/2026</td>
                                <td>Cancelar</td>
                                <td> - </td>
                                <td><span class="badge bg-secondary text-light">Pendente</span></td>
                                <td> 
                                    <button class="btn btn-sm btn-outline-success">Editar</button>
                                    <button class="btn btn-sm btn-outline-info">Ver</button>
                                </td>
                            </tr>
                        </thead>
                        <tbody id="lista-solicitacoes"></tbody>
                    </table>
                </div>
            </div>

            <regime-suplementar-modal></regime-suplementar-modal>

            
        </main>

        <footer class="bg-white border-top py-3 mt-auto">
            <page-footer></page-footer>
        </footer>

          <script>
            lucide.createIcons();
        </script>   

    </body>
</html>
