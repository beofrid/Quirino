<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Usuários | Sistema Quirino</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
        <link rel="stylesheet" href="../../style.css">
        <link rel="shortcut icon" href="../../src/icon.ico" type="image/x-icon">
        <script type="module" src="../../scripts/components/PublicNavbar.js"></script>
        <script type="module" src="../../scripts/components/Footer.js"></script>
        <script type="module" src="../../scripts/components/AdmRequestNavbar.js"></script>
        <script type="module" src="../../scripts/controllers/UserCreationController.js"></script>
    </head>

    <body class="bg-light d-flex flex-column min-vh-100 montserrat">
        <header>
            <public-navbar></public-navbar>
        </header>

        <main class="flex-grow-1">
            <div class="container pb-4">
                <h1 class="h2 mb-4">Painel do RH: Usuários</h1>

                <request-navbar active="usuarios"></request-navbar>

                <div class="row g-4 align-items-start">
                    <div class="col-12 col-lg-5">
                        <section class="card border-0 shadow-sm p-4" aria-labelledby="tituloNovoUsuario">
                            <h2 id="tituloNovoUsuario" class="h4 text-center mb-4">
                                <img src="../../src/icon.png" style="width: 40px;" alt="">
                                Novo usuário
                            </h2>

                            <form id="formCriarUsuario">
                                <div class="mb-3">
                                    <label for="email" class="form-label">E-mail</label>
                                    <input type="email" class="form-control" id="email" autocomplete="email" required aria-required="true">
                                </div>

                                <div class="mb-3">
                                    <label for="senha" class="form-label">Senha (mínimo 6 caracteres)</label>
                                    <input type="password" class="form-control" id="senha" minlength="6" autocomplete="new-password" required aria-required="true">
                                </div>

                                <div class="mb-3">
                                    <label for="role" class="form-label">Nível de acesso (role)</label>
                                    <select class="form-select" id="role" required aria-required="true">
                                        <option value="" disabled selected>Selecione...</option>
                                        <option value="escola">Escola</option>
                                        <option value="pedagogico">Pedagógico</option>
                                        <option value="rh_sme">RH Interno</option>
                                        <option value="rh_adm">RH Geral</option>
                                    </select>
                                </div>

                                <div class="mb-4">
                                    <label for="setor" class="form-label">Nome do setor/escola</label>
                                    <input type="text" class="form-control" id="setor" placeholder="Ex.: Escola Castelo" required aria-required="true">
                                </div>

                                <button id="botaoRegistrar" type="submit" class="btn btn-primary w-100">
                                    Registrar usuário
                                </button>
                                <div id="feedbackMensagem" class="alert d-none mt-3 mb-0" role="status" aria-live="polite"></div>
                            </form>
                        </section>
                    </div>

                    <div class="col-12 col-lg-7">
                        <section class="card border-0 shadow-sm" aria-labelledby="tituloListaUsuarios">
                            <div class="card-header bg-white d-flex flex-wrap align-items-center justify-content-between gap-2 py-3">
                                <h2 id="tituloListaUsuarios" class="h4 mb-0">Usuários do sistema</h2>
                                <span id="totalUsuarios" class="badge text-bg-secondary">Carregando...</span>
                            </div>

                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="table-light">
                                            <tr>
                                                <th scope="col" class="ps-4">Nome do setor/escola</th>
                                                <th scope="col">Nível de acesso</th>
                                            </tr>
                                        </thead>
                                        <tbody id="listaUsuarios">
                                            <tr>
                                                <td colspan="2" class="text-center text-secondary py-4">
                                                    Carregando usuários...
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </main>

        <footer class="bg-white border-top py-3 mt-auto">
            <page-footer></page-footer>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
