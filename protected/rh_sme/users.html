<!doctype html>
<html lang="pt-br">
<head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sistema Quirino</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
        <link rel="stylesheet" href="/style.css">
        <link rel="shortcut icon" href="/src/icon.ico" type="image/x-icon">
        <script type="module" src="/scripts/components/PublicNavbar.js"></script>
        <script type="module" src="/scripts/components/Footer.js"></script>
        <script type="module" src="/scripts/components/AdmRequestNavbar.js"></script>
</head>
    <body class="bg-light d-flex flex-column min-vh-100 montserrat">
    
    <public-navbar></public-navbar>
    <main>
        
        <div class="container ">
            <h2 class="mb-4">Painel do RH: Usuários</h2>
            
            <request-navbar active="usuarios"></request-navbar>

            <div class="d-flex justify-content-center">

                <div class="card shadow-sm p-4 w-100" style="max-width: 500px;">
                    <h2 class="text-center mb-4"><img src="/src/icon.png" style="width: 40px;" alt="ficha de poker"> Novo Usuário</h2>
                    
                    <form id="formCriarUsuario">
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" required aria-required="true">
                        </div>
                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha (mínimo 6 caracteres)</label>
                            <input type="password" class="form-control" id="senha" minlength="6" required aria-required="true">
                        </div>
                        <div class="mb-3">
                            <label for="role" class="form-label">Nível de Acesso (Role)</label>
                            <select class="form-select" id="role" required aria-required="true">
                                <option value="" disabled selected>Selecione...</option>
                                <option value="escola">Escola</option>
                                <option value="pedagogico">Pedagógico</option>
                                <option value="rh_sme">RH Interno</option>
                                <option value="rh_adm">RH Geral</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label for="setor" class="form-label">Nome do Setor/Escola</label>
                            <input type="text" class="form-control" id="setor" placeholder="Ex: Escola Castelo" required aria-required="true">
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100">Registrar Usuário</button>
                        <div id="feedbackMensagem" class="mt-3 text-center fw-bold" aria-live="polite"></div>
                    </form>
                </div>
            </div>
        </div>
    </main>

       <footer class="bg-white border-top py-3 mt-auto">
            <page-footer></page-footer>
        </footer>
<script type="module" src="../scripts/controllers/UserCreationController.js"></script>
</body>
</html>
