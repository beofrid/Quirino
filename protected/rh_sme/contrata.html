<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sistema Quirino</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
        <link rel="stylesheet" href="../../style.css">
        <link rel="shortcut icon" href="../../src/icon.ico" type="image/x-icon">
        <script type="module" src="../../scripts/components/PublicNavbar.js"></script>
        <script type="module" src="../../scripts/components/Footer.js"></script>
        <script type="module" src="../../scripts/components/AdmRequestNavbar.js"></script>
    </head>
    <body class="bg-light d-flex flex-column min-vh-100 montserrat">

        <header>
            <public-navbar></public-navbar>
        </header>
        <main>
             <div class="container">
                <h2 class="mb-4 d-flex align-items-center gap-2">
                    Painel do RH: Contratação
                    <i data-lucide="construction" class="text-warning rounded bg-dark text-start mx-2" width="28" height="28" aria-hidden="true"></i>
                </h2>
       

                <request-navbar active="contratacao"></request-navbar>

                <div class="card shadow-sm p-4 bg-white">
                    <table class="table align-middle">
                         <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cargo</th>
                                <th>Status</th>
                                <th>Ação</th>
                            </tr>
                            <tr>
                                <td>1</td>
                                <td >Professor de Anos Finais - Educação Física</td>
                                <td> <span class="badge bg-light text-primary">aprovado_pedagogico</span></td>
                                <td>
                                    <div>
                                        <button class="btn btn-sm btn-outline-success me-1">Encaminhar</button>
                                        <button class="btn btn-sm btn-outline-info">Ver</button>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td>2</td>
                                <td >Servente</td>
                                <td> <span class="badge bg-light text-primary">em_contratacao</span></td>
                                <td>
                                    <div>
                                        <button class="btn btn-sm btn-outline-info">Ver</button>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td>3</td>
                                <td >Cuidador</td>
                                <td> <span class="badge bg-light text-success">contratado</span></td>
                                <td>
                                    <div>
                                        <button class="btn btn-sm btn-outline-info">Ver</button>
                                    </div>
                                </td>
                            </tr>
                        </thead>
                        <tbody id="lista-rh">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <footer class="bg-white border-top py-3 mt-auto">
            <page-footer></page-footer>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script>lucide.createIcons();</script>
    </body>
</html>
