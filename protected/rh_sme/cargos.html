<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Cargos | Sistema Quirino</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="../../style.css">
        <link rel="shortcut icon" href="../../src/icon.ico" type="image/x-icon">
        <script type="module" src="../../scripts/components/PublicNavbar.js"></script>
        <script type="module" src="../../scripts/components/Footer.js"></script>
        <script type="module" src="../../scripts/components/AdmRequestNavbar.js"></script>
        <script type="module" src="../../scripts/controllers/PositionController.js"></script>
    </head>

    <body class="bg-light d-flex flex-column min-vh-100 montserrat">
        <header>
            <public-navbar></public-navbar>
        </header>

        <main class="flex-grow-1">
            <div class="container pb-4">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
                    <h1 class="h2 mb-0">Painel do RH: Cargos cadastrados</h1>
                    <span id="total-cargos" class="badge text-bg-secondary">Carregando...</span>
                </div>

                <request-navbar active="cargos"></request-navbar>

                <div class="card border-0 shadow-sm bg-white">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col">Cargo</th>
                                    <th scope="col">Carga horária</th>
                                </tr>
                            </thead>
                            <tbody id="lista-cargos">
                                <tr>
                                    <td colspan="2" class="text-center text-secondary py-4">Carregando cargos...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <footer class="bg-white border-top py-3 mt-auto">
            <page-footer></page-footer>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
